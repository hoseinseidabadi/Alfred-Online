name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    # پایگاه داده SQLite است — فایل روی دیسک، نه سرویس. سرویس Postgres حذف شد.
    env:
      TEST_DATABASE_URL: file:./data/alfred-test.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      # گیت مسدودکنندهٔ قانون اساسی — بند «تاب‌آوری و آزمون».
      #
      # از ۱۴۰۵/۰۶/۰۹ هر شش آزمون نوشته شده‌اند، پس این قدم دیگر «عمداً قرمز»
      # نیست: از این به بعد هر قرمزی یعنی یکی از ناورداهای قانون اساسی شکسته
      # یا آزمونش حذف شده. نگهبان هر دو حالت را می‌گیرد.
      - name: گیت قانون اساسی — آزمون‌های تاب‌آوری الزامی
        run: npm run test:resilience

      # آزمون‌های یکپارچه اگر پایگاه داده نباشد بی‌صدا رد می‌شوند و CI سبز
      # می‌ماند. آزمون «پیش‌نیاز آزمون‌های یکپارچه» با دیدن CI=true خودش
      # شکست می‌دهد، پس این سبزیِ دروغین ممکن نیست.
      - name: همهٔ آزمون‌ها
        run: npm test
