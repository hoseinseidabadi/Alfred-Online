# PostgreSQL توسعهٔ محلی.
#
# فقط برای ماشین دولوپر است — استقرار روی لیارا دیتابیس مدیریت‌شدهٔ خودش را
# دارد. نسخهٔ ۱۷ انتخاب شد چون همان چیزی است که لیارا امروز عرضه می‌کند.
#
# رمز اینجا عمداً بی‌اهمیت است: این کانتینر فقط روی 127.0.0.1 گوش می‌دهد و
# هیچ دادهٔ واقعی‌ای ندارد. راز واقعی هرگز در ریپو نمی‌آید.

services:
  postgres:
    image: postgres:17-alpine
    container_name: alfred-online-postgres
    restart: unless-stopped
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_USER: alfred
      POSTGRES_PASSWORD: alfred_local_dev
      POSTGRES_DB: alfred_online
    volumes:
      - alfred-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U alfred -d alfred_online']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  alfred-pgdata:
